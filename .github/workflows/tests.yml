name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy scikit-learn biopython biotite gemmi pytest immunum==2.1.0 rapidfuzz
      - run: PYTHONPATH=.:src pytest -q tests
