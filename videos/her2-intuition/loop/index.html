<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Where the design window sits</title>
  <script src="assets/gsap-3.15.0.min.js"></script>
  <style>
    @font-face {font-family:Geist;src:url("assets/Geist-Regular.woff2") format("woff2");font-weight:400}
    @font-face {font-family:Geist;src:url("assets/Geist-Bold.woff2") format("woff2");font-weight:700}
    :root {
      --cream: #f7f4ed;
      --ink: #142c3d;
      --muted: #536575;
      --teal: #197d74;
      --amber: #a45b08;
      --rule: #d5d2c8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 960px; height: 440px; overflow: hidden; }
    #main { position: relative; width: 100%; height: 100%; background: var(--cream); color: var(--ink); font: 20px Geist, sans-serif; }
    .clip { position: absolute; inset: 0; }
    h1 { position: absolute; top: 24px; left: 42px; margin: 0; font: 700 30px/1.2 Geist, sans-serif; }
    .top-rule { position: absolute; top: 72px; left: 42px; right: 42px; border-top: 1px solid var(--rule); }
    footer { position: absolute; display: flex; justify-content: space-between; left: 42px; right: 42px; bottom: 21px; padding-top: 13px; border-top: 1px solid var(--rule); color: var(--muted); }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    svg text { fill: var(--ink); }
    svg .secondary { fill: var(--muted); }
    .bold { font-weight: 700; }
    .cdr { fill: none; stroke: var(--muted); stroke-width: 4.2; stroke-linecap: round; }
    .cdr-window { stroke: var(--teal); }
    .guide { fill: none; stroke: #a4b0ad; stroke-width: 1.5; stroke-dasharray: 4 5; }
  </style>
</head>
<body>
<main id="main" data-composition-id="main" data-start="0" data-duration="8" data-width="960" data-height="440">
  <svg id="loop-art" class="clip" data-start="0" data-duration="8" data-track-index="0" viewBox="0 0 960 440" role="img" aria-label="One IgG Fab tip magnifies into paired heavy and light variable domains with three loops each. A second magnification highlights the ten-residue window within heavy-chain CDRH3.">
    <defs>
      <g id="h3-trace" class="cdr">
        <path d="M0 0 Q7 -4 12 -12 M61 -12 Q62 -4 60 0"/>
        <path class="cdr-window" d="M12 -12 C23 -34 16 -57 32 -64 C49 -72 62 -43 61 -12"/>
      </g>
    </defs>

    <path id="tip-guides" class="guide" d="M234 137 L322 113 M243 190 L323 299"/>
    <path id="window-guides" class="guide" d="M471 139 L763 112 M470 175 L690 291"/>

    <g id="igg">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M162 306 L162 252 Q161 229 144 210 L104 166 M179 306 L179 252 Q180 229 197 210 L237 166" stroke="var(--ink)" stroke-width="13"/>
        <path d="M153 207 L112 161 M188 207 L229 161" stroke="var(--ink)" stroke-width="8"/>
        <path d="M132 213 L94 177 M209 213 L247 177" stroke="#81939d" stroke-width="11"/>
        <path d="M105 187 L92 175 M236 187 L249 175" stroke="#536575" stroke-width="11"/>
        <path d="M162 272 H179 M162 281 H179" stroke="var(--ink)" stroke-width="3"/>
      </g>
      <circle id="tip-ring" cx="236" cy="166" r="29" fill="none" stroke="var(--teal)" stroke-width="2"/>
      <path d="M235 137 L235 120 H199" fill="none" stroke="var(--teal)" stroke-width="1.5"/>
      <text x="192" y="126" text-anchor="end" class="bold">Fab tip</text>
      <text x="171" y="351" text-anchor="middle" class="secondary">Whole IgG</text>
    </g>

    <g id="variable-pair">
      <path d="M331 195 C338 182 357 185 373 185 C390 183 408 187 422 186 C438 186 454 181 468 192 C474 214 469 243 465 263 C461 286 442 307 418 312 C390 321 354 308 344 289 C332 271 321 221 331 195Z" fill="#e4e9e7" stroke="#7e9297" stroke-width="2"/>
      <path d="M487 192 C502 180 519 186 535 186 C553 187 579 182 596 192 C608 207 605 244 600 267 C595 298 568 314 544 314 C516 315 493 296 485 270 C478 248 477 209 487 192Z" fill="#e9e9e4" stroke="#87949a" stroke-width="2"/>
      <g fill="none" stroke="#b4c2c1" stroke-linecap="round" stroke-width="2">
        <path d="M349 222 Q382 247 367 282 M382 214 Q410 245 389 296 M416 214 Q442 242 423 293 M445 218 Q459 246 442 275"/>
        <path d="M497 220 Q522 253 516 282 M527 216 Q551 253 545 294 M554 215 Q575 243 571 284 M580 219 Q593 240 584 263"/>
      </g>

      <g class="cdr">
        <path d="M341 188 C333 171 340 154 350 155 C359 156 363 174 365 186"/>
        <path d="M373 186 C369 167 376 142 385 145 C398 146 399 173 403 186"/>
        <use href="#h3-trace" x="409" y="187"/>
        <path d="M486 188 C484 173 488 158 496 157 C506 156 508 173 509 186"/>
        <path d="M518 186 C517 170 520 146 532 147 C545 149 546 170 545 187"/>
        <path d="M557 186 C561 171 563 158 574 158 C586 158 588 174 593 189"/>
      </g>
      <circle id="loop-ring" cx="442" cy="153" r="39" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-dasharray="3 5"/>
    </g>
    <g id="pair-labels">
      <text x="399" y="247" text-anchor="middle" class="bold">VH</text>
      <text x="399" y="275" text-anchor="middle" class="secondary">Heavy</text>
      <text x="543" y="247" text-anchor="middle" class="bold">VL</text>
      <text x="543" y="275" text-anchor="middle" class="secondary">Light</text>
      <text x="468" y="351" text-anchor="middle" class="secondary">3 loops per domain</text>
    </g>

    <g id="magnified-window">
      <use href="#h3-trace" x="409" y="187"/>
    </g>
    <g id="window-labels">
      <path d="M863 208 H906 V305" fill="none" stroke="var(--teal)" stroke-width="1.5"/>
      <circle cx="863" cy="208" r="3" fill="var(--teal)"/>
      <text x="784" y="327" text-anchor="middle" class="bold" style="fill:var(--teal)">10-residue design window</text>
      <text x="784" y="351" text-anchor="middle" class="secondary">CDRH3 on VH</text>
    </g>
  </svg>
  <h1>Where the design window sits</h1>
  <div class="top-rule"></div>
  <footer><span>Schematic, not a predicted structure</span><span>Scaffold kept fixed</span></footer>
</main>
<script>
  const timeline = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });

  gsap.set("#variable-pair", { svgOrigin: "236 166", scale: 0.42, opacity: 0.28 });
  gsap.set("#pair-labels, #loop-ring, #window-guides, #magnified-window, #window-labels", { opacity: 0 });
  gsap.set("#magnified-window", { svgOrigin: "409 187" });
  gsap.set("#tip-guides", { opacity: 0.35 });

  timeline
    .to("#tip-ring", { scale: 1.12, transformOrigin: "50% 50%", duration: 0.46, yoyo: true, repeat: 1 }, 0.34)
    .to("#variable-pair", { scale: 1, opacity: 1, duration: 1.55 }, 0.55)
    .to("#tip-guides", { opacity: 1, duration: 1.15 }, 0.67)
    .to("#pair-labels", { opacity: 1, duration: 0.36 }, 1.75)
    .to("#loop-ring", { opacity: 1, duration: 0.32 }, 2.08)
    .to("#magnified-window", { x: 281, y: 109, scale: 2.78, opacity: 1, duration: 1.38 }, 2.41)
    .to("#window-guides", { opacity: 0.82, duration: 1.10 }, 2.73)
    .to("#window-labels", { opacity: 1, duration: 0.42 }, 3.76)
    .to("#window-labels, #window-guides", { opacity: 0, duration: 0.48 }, 6.21)
    .to("#magnified-window", { x: 0, y: 0, scale: 1, opacity: 0, duration: 0.84 }, 6.21)
    .to("#loop-ring, #pair-labels", { opacity: 0, duration: 0.47 }, 6.84)
    .to("#variable-pair", { scale: 0.42, opacity: 0.28, duration: 0.81 }, 6.89)
    .to("#tip-guides", { opacity: 0.35, duration: 0.81 }, 6.89);

  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
</script>
</body>
</html>
